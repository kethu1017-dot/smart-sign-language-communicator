<!DOCTYPE html>
<html>
<head>
  <title>Smart Sign Language Communicator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7ff;
      color: #222;
    }

    .header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin-top: 8px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card h2 {
      color: #4f46e5;
    }

    button {
      border: none;
      padding: 13px 22px;
      margin: 8px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .start {
      background: #4f46e5;
      color: white;
    }

    .speak {
      background: #7c3aed;
      color: white;
    }

    #camera {
      width: 100%;
      max-width: 500px;
      border-radius: 15px;
      background: #111;
      margin-top: 15px;
    }

    #result {
      background: #f1f3ff;
      padding: 18px;
      border-radius: 12px;
      font-size: 18px;
      min-height: 55px;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>

<body>

  <div class="header">
    <h1>🤟 Smart Sign Language Communicator</h1>
    <p>AI Based Communication System</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>📷 Sign Detection</h2>

      <p>Show your hand sign in front of the camera.</p>

      <button class="start" onclick="startDetection()">
        ▶ Start Detection
      </button>

      <video id="camera" autoplay playsinline></video>

      <p id="status">Show your hand in front of camera</p>
    </div>

    <div class="card">
      <h2>📝 Recognized Text</h2>

      <div id="result">
        Waiting for sign...
      </div>

      <br>

      <button class="speak" onclick="speakText()">
        🔊 Speak
      </button>
    </div>

  </div>

<script>

const video = document.getElementById("camera");
const result = document.getElementById("result");
const statusText = document.getElementById("status");

let cameraStarted = false;

/* Start Camera + AI Hand Detection */

async function startDetection() {

  if (cameraStarted) {
    result.innerText = "Detection already started";
    return;
  }

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
  facingMode: "environment"
      }
    });

    video.srcObject = stream;

    statusText.innerText = "Camera started - Show your hand";

    cameraStarted = true;

    startHandDetection();

  } catch (error) {

    statusText.innerText = "Camera permission denied";

    alert("Please allow camera permission in your browser.");

  }
}


/* MediaPipe Hands */

function startHandDetection() {

  const hands = new Hands({
    locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
  });

  hands.onResults(onResults);

  video.addEventListener("loadeddata", async function processFrame() {

  await hands.send({image: video});

  requestAnimationFrame(processFrame);
  
});

}

/* When hand is detected */

function onResults(results) {

  if (results.multiHandLandmarks &&
      results.multiHandLandmarks.length > 0) {

    statusText.innerText = "✋ Hand detected";

    const landmarks = results.multiHandLandmarks[0];

    const fingers = countFingers(landmarks);

    if (fingers === 5) {
      result.innerText = "Hello";
    }

    else if (fingers === 0) {
      result.innerText = "Fist";
    }

    else if (fingers === 1) {
      result.innerText = "One Finger";
    }

    else if (fingers === 2) {
      result.innerText = "Thank you";
    }

    else if (fingers === 3) {
      result.innerText = "Three Fingers";
    }

    else if (fingers === 4) {
      result.innerText = "Four Fingers";
    }

  } else {

    statusText.innerText = "Show your hand in front of camera";

  }
}


/* Count fingers */

function countFingers(lm) {

  let count = 0;

  /* Index finger */
  if (lm[8].y < lm[6].y) {
    count++;
  }

  /* Middle finger */
  if (lm[12].y < lm[10].y) {
    count++;
  }

  /* Ring finger */
  if (lm[16].y < lm[14].y) {
    count++;
  }

  /* Little finger */
  if (lm[20].y < lm[18].y) {
    count++;
  }

  /* Thumb */
  if (Math.abs(lm[4].x - lm[5].x) > 0.12) {
    count++;
  }

  return count;
}


/* Text to Speech */

function speakText() {

  const text = result.innerText;

  if (text === "Waiting for sign...") {
    return;
  }

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";

  speechSynthesis.speak(speech);
}

</script>

</body>
</html>
