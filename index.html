<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Sign Language Communicator</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f4f7ff;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #222;
    }

    h1 {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 25px;
    }

    .card {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    video {
      width: 100%;
      max-width: 600px;
      height: 400px;
      background: black;
      border-radius: 12px;
      object-fit: cover;
    }

    button {
      margin: 10px 5px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #3730a3;
    }

    #status {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Smart Sign Language Communicator</h1>

  <div class="card">

    <h2>Camera Test</h2>

    <video id="camera" autoplay playsinline></video>

    <br>

    <button onclick="startFrontCamera()">
      📱 Front Camera
    </button>

    <button onclick="startBackCamera()">
      📷 Back Camera
    </button>

    <button onclick="stopCamera()">
      ⛔ Stop Camera
    </button>

    <p id="status">Camera not started</p>

  </div>


  <script>

    let stream = null;

    const video = document.getElementById("camera");
    const statusText = document.getElementById("status");


    // FRONT CAMERA
    async function startFrontCamera() {

      stopCamera();

      try {

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;

        statusText.innerText = "✅ Front Camera Working";

      } catch (error) {

        console.error(error);

        statusText.innerText =
          "❌ Front Camera Error: " + error.message;
      }
    }


    // BACK CAMERA
    async function startBackCamera() {

      stopCamera();

      try {

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              exact: "environment"
            }
          },
          audio: false
        });

        video.srcObject = stream;

        statusText.innerText = "✅ Back Camera Working";

      } catch (error) {

        console.error(error);

        // Fallback method
        try {

          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "environment"
            },
            audio: false
          });

          video.srcObject = stream;

          statusText.innerText =
            "✅ Back Camera Working";

        } catch (error2) {

          console.error(error2);

          statusText.innerText =
            "❌ Back Camera Error: " + error2.message;
        }
      }
    }


    // STOP CAMERA
    function stopCamera() {

      if (stream) {

        stream.getTracks().forEach(track => {
          track.stop();
        });

        stream = null;
      }

      video.srcObject = null;

      statusText.innerText = "Camera stopped";
    }

  </script>

</body>
</html>
