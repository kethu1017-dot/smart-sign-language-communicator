<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Sign Language Communicator</title>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f4f7ff;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #222;
    }

    h1 {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 25px;
    }

    .card {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    video {
      width: 100%;
      max-width: 600px;
      height: 400px;
      background: black;
      border-radius: 12px;
      object-fit: cover;
    }

    button {
      margin: 10px 5px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #status,
    #handStatus {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Smart Sign Language Communicator</h1>

  <div class="card">

    <h2>Camera & Hand Detection</h2>

    <video id="camera" autoplay playsinline></video>

    <br>

    <button onclick="startFrontCamera()">
      📱 Front Camera
    </button>

    <button onclick="startBackCamera()">
      📷 Back Camera
    </button>

    <button onclick="stopCamera()">
      ⛔ Stop Camera
    </button>

    <p id="status">Camera not started</p>

    <p id="handStatus">✋ Hand not detected</p>

  </div>


  <script>

    let stream = null;
    let hands = null;
    let detecting = false;

    const video = document.getElementById("camera");
    const statusText = document.getElementById("status");
    const handStatus = document.getElementById("handStatus");


    // =========================
    // FRONT CAMERA
    // =========================

    async function startFrontCamera() {

      stopCamera();

      try {

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;

        statusText.innerText =
          "✅ Front Camera Working";

        startHandDetection();

      } catch (error) {

        console.error(error);

        statusText.innerText =
          "❌ Front Camera Error: " + error.message;
      }
    }


    // =========================
    // BACK CAMERA
    // =========================

    async function startBackCamera() {

      stopCamera();

      try {

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              exact: "environment"
            }
          },
          audio: false
        });

        video.srcObject = stream;

        statusText.innerText =
          "✅ Back Camera Working";

        startHandDetection();

      } catch (error) {

        console.error(error);

        try {

          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "environment"
            },
            audio: false
          });

          video.srcObject = stream;

          statusText.innerText =
            "✅ Back Camera Working";

          startHandDetection();

        } catch (error2) {

          console.error(error2);

          statusText.innerText =
            "❌ Back Camera Error: " + error2.message;
        }
      }
    }


    // =========================
    // STOP CAMERA
    // =========================

    function stopCamera() {

      detecting = false;

      if (stream) {

        stream.getTracks().forEach(track => {
          track.stop();
        });

        stream = null;
      }

      video.srcObject = null;

      statusText.innerText =
        "Camera stopped";

      handStatus.innerText =
        "✋ Hand not detected";
    }


    // =========================
    // HAND DETECTION
    // =========================

    function startHandDetection() {

      if (!hands) {

        hands = new Hands({
          locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
          }
        });

        hands.setOptions({

          maxNumHands: 1,

          modelComplexity: 1,

          minDetectionConfidence: 0.6,

          minTrackingConfidence: 0.6

        });


        hands.onResults((results) => {

          if (
            results.multiHandLandmarks &&
            results.multiHandLandmarks.length > 0
          ) {

            handStatus.innerText =
              "✋ Hand Detected";

          } else {

            handStatus.innerText =
              "✋ Hand not detected";
          }

        });
      }


      if (detecting) {
        return;
      }

      detecting = true;

      detectHand();
    }


    // =========================
    // SEND CAMERA IMAGE
    // =========================

    async function detectHand() {

      if (!detecting) {
        return;
      }

      if (
        video.readyState >= 2 &&
        video.videoWidth > 0
      ) {

        await hands.send({
          image: video
        });
      }

      requestAnimationFrame(detectHand);
    }

  </script>

</body>
</html>
