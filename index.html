<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Face & Body Language Detection</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f5ff;
    text-align: center;
}

header {
    background: linear-gradient(135deg, #5145cd, #8b35e8);
    color: white;
    padding: 20px;
}

h1 {
    margin: 0;
    font-size: 30px;
}

.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 15px;
}

.video-box {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: auto;
    background: black;
    border-radius: 15px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
    transform: scaleX(-1);
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
}

.result {
    margin-top: 20px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.result h2 {
    color: #5145cd;
    margin-top: 0;
}

.detected {
    font-size: 20px;
    font-weight: bold;
    margin: 12px;
    padding: 12px;
    background: #f0edff;
    border-radius: 10px;
}

button {
    margin-top: 20px;
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #5145cd;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #3e35a5;
}
</style>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

</head>

<body>

<header>
    <h1>Smart Face & Body Language Detection</h1>
    <p>Face + Body + Pose Detection</p>
</header>

<div class="container">

    <div class="video-box">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <button onclick="startCamera()">Start Camera</button>

    <div class="result">

        <h2>Detection Result</h2>

        <div class="detected">
            🙂 Face:
            <span id="faceResult">Waiting...</span>
        </div>

        <div class="detected">
            🧍 Body:
            <span id="bodyResult">Waiting...</span>
        </div>

        <div class="detected">
            🙌 Body Language:
            <span id="gestureResult">Waiting...</span>
        </div>

    </div>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const faceResult = document.getElementById("faceResult");
const bodyResult = document.getElementById("bodyResult");
const gestureResult = document.getElementById("gestureResult");

let faceDetected = false;
let poseDetected = false;

/* =========================
   FACE MESH
========================= */

const faceMesh = new FaceMesh({
    locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }
});

faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

faceMesh.onResults((results) => {

    if (results.multiFaceLandmarks &&
        results.multiFaceLandmarks.length > 0) {

        faceDetected = true;

        faceResult.innerText = "Detected";

        const landmarks = results.multiFaceLandmarks[0];

        /*
        Mouth opening detection
        */

        const upperLip = landmarks[13];
        const lowerLip = landmarks[14];

        const mouthDistance =
            Math.abs(lowerLip.y - upperLip.y);

        if (mouthDistance > 0.035) {
            faceResult.innerText = "Face + Mouth Open";
        } else {
            faceResult.innerText = "Face Detected";
        }

    } else {

        faceDetected = false;
        faceResult.innerText = "No Face";

    }

});


/* =========================
   POSE / BODY
========================= */

const pose = new Pose({
    locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }
});

pose.setOptions({

    modelComplexity: 1,

    smoothLandmarks: true,

    enableSegmentation: false,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


pose.onResults((results) => {

    if (!results.poseLandmarks) {

        poseDetected = false;

        bodyResult.innerText = "No Body";

        gestureResult.innerText = "Waiting...";

        return;
    }

    poseDetected = true;

    bodyResult.innerText = "Body Detected";

    const lm = results.poseLandmarks;

    /*
    Important body landmarks
    */

    const leftShoulder = lm[11];
    const rightShoulder = lm[12];

    const leftWrist = lm[15];
    const rightWrist = lm[16];

    const leftHip = lm[23];
    const rightHip = lm[24];

    let detectedGesture = "Normal Body Position";


    /* =========================
       HAND / ARM DETECTION
    ========================= */

    if (
        leftWrist.y < leftShoulder.y &&
        rightWrist.y < rightShoulder.y
    ) {

        detectedGesture = "Both Hands Raised 🙌";

    }

    else if (
        leftWrist.y < leftShoulder.y
    ) {

        detectedGesture = "Left Hand Raised 👋";

    }

    else if (
        rightWrist.y < rightShoulder.y
    ) {

        detectedGesture = "Right Hand Raised 👋";

    }

    else if (
        leftWrist.y > leftHip.y &&
        rightWrist.y > rightHip.y
    ) {

        detectedGesture = "Hands Down";

    }

    gestureResult.innerText = detectedGesture;

});


/* =========================
   CAMERA
========================= */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    width: 640,
                    height: 480
                },

                audio: false

            });

        video.srcObject = stream;

        video.onloadeddata = () => {

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            detectFrame();

        };

    }

    catch (error) {

        alert(
            "Camera permission denied or camera not available."
        );

        console.error(error);

    }

}


/* =========================
   DETECTION LOOP
========================= */

async function detectFrame() {

    if (video.readyState >= 2) {

        await faceMesh.send({
            image: video
        });

        await pose.send({
            image: video
        });

    }

    requestAnimationFrame(detectFrame);

}

</script>

</body>
</html>
