<!DOCTYPE html>
<html>
<head>
  <title>Smart Sign Language Communicator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f7ff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #4f46e5;
    }

    .card {
      background: white;
      max-width: 700px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    video {
      width: 100%;
      max-width: 500px;
      border-radius: 15px;
      background: black;
    }

    button {
      margin: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      font-size: 18px;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Smart Sign Language Communicator</h1>

  <div class="card">

    <h2>Camera</h2>

    <video id="camera" autoplay playsinline style="width:100%; max-width:600px; height:400px; background:#000; border-radius:12px; object-fit:cover;"></video>

    <br>

    <button onclick="startCamera()">Start Camera</button>
    
    <button onclick="switchCamera()">Switch Front / Back</button>

    <p id="status">Camera not started</p>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const video = document.getElementById("camera");
const status = document.getElementById("status");

let detecting = false;
let currentCamera = "user";

const hands = new Hands({
  locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

function detectYes(landmarks) {

  const thumbTip = landmarks[4];
  const thumbIP = landmarks[3];

  const indexTip = landmarks[8];
  const indexPIP = landmarks[6];

  const middleTip = landmarks[12];
  const middlePIP = landmarks[10];

  const ringTip = landmarks[16];
  const ringPIP = landmarks[14];

  const pinkyTip = landmarks[20];
  const pinkyPIP = landmarks[18];

  const thumbUp = thumbTip.y < thumbIP.y;
  const indexFolded = indexTip.y > indexPIP.y;
  const middleFolded = middleTip.y > middlePIP.y;
  const ringFolded = ringTip.y > ringPIP.y;
  const pinkyFolded = pinkyTip.y > pinkyPIP.y;

  return (
    thumbUp &&
    indexFolded &&
    middleFolded &&
    ringFolded &&
    pinkyFolded
  );
}

hands.onResults((results) => {

  if (
  results.multiHandLandmarks &&
  results.multiHandLandmarks.length > 0
) {

  const landmarks = results.multiHandLandmarks[0];

  if (detectYes(landmarks)) {
    status.innerText = "Yes 👍";
  } else {
    status.innerText = "Hand detected 🖐️";
  }
    
});

async function detectHands() {

  if (video.readyState >= 2) {
    await hands.send({
      image: video
    });
  }

  requestAnimationFrame(detectHands);
}

async function startCamera() {

  try {

    // Stop old camera if already running
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: currentCamera
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    status.innerText = "Camera working ✅";

    if (!detecting) {
      detecting = true;
      detectHands();
    }

  } catch (error) {

    console.log("Camera Error:", error);

    status.innerText = "Camera permission/error ❌";

  }

}
  
async function switchCamera() {

  currentCamera =
    currentCamera === "user" ? "environment" : "user";

  const oldStream = video.srcObject;

  if (oldStream) {
    oldStream.getTracks().forEach(track => track.stop());
  }

  await startCamera();
}
  
</script>
</body>
</html>
