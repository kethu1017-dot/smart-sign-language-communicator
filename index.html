<!DOCTYPE html>
<html>
<head>
  <title>Smart Sign Language Communicator</title>

  <style>
    body {
      background: #f4f7ff;
      color: #222;
      font-family: Arial;
      text-align: center;
      margin: 0;
    }

    .header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 30px 15px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    video {
      width: 100%;
      max-width: 500px;
      border-radius: 15px;
      margin-top: 15px;
    }

    #status {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Smart Sign Language Communicator</h1>
    <p>Hand Detection Test</p>
  </div>

  <div class="container">

    <div class="card">

      <h2>✋ Hand Detection</h2>

      <video id="video" autoplay playsinline></video>

      <button id="switchCamera">🔄 Switch Camera</button>

      <p id="status">Starting camera...</p>

    </div>

  </div>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <!-- Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>

    const video = document.getElementById("video");
    const statusText = document.getElementById("status");

    // Hand Detection
    const hands = new Hands({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
      }
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // Results
    hands.onResults(function(results) {

      if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
      ) {

        statusText.innerText = "✋ Hand detected";

      } else {

        statusText.innerText = "Show your hand in front of camera";

      }

    });

    // Camera
     let currentCamera = "user";
     let stream;

    async function startCamera() {

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
      facingMode: currentCamera
    },
      audio: false
    });

    video.srcObject = stream;

    video.onloadedmetadata = () => {
    video.play();
    processFrame();
  };
}

async function processFrame() {
  await hands.send({ image: video });
  requestAnimationFrame(processFrame);
}

document.getElementById("switchCamera").onclick = () => {

  currentCamera =
    currentCamera === "user" ? "environment" : "user";

  startCamera();
};

startCamera();
    
  </script>

</body>
</html>
