<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Sign Language Communicator</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f4f7ff;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #222;
    }

    h1 {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 20px;
      border-radius: 15px;
    }

    .card {
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    video {
      width: 100%;
      max-width: 600px;
      height: 400px;
      background: black;
      border-radius: 12px;
      object-fit: cover;
    }

    button {
      margin: 8px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      font-size: 18px;
      font-weight: bold;
    }

    #handStatus {
      font-size: 20px;
      font-weight: bold;
    }

    #resultText {
      margin-top: 20px;
      padding: 20px;
      background: #eef2ff;
      border-radius: 15px;
      font-size: 32px;
      font-weight: bold;
      color: #4f46e5;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>

<body>

  <h1>Smart Sign Language Communicator</h1>

  <div class="card">

    <h2>📷 Camera</h2>

    <video id="camera" autoplay playsinline></video>

    <br>

    <button onclick="startFrontCamera()">
      📱 Front Camera
    </button>

    <button onclick="startBackCamera()">
      📷 Back Camera
    </button>

    <button onclick="stopCamera()">
      ⛔ Stop Camera
    </button>

    <p id="status">Camera not started</p>

  </div>


  <div class="card">

    <h2>✋ Hand Detection</h2>

    <p id="handStatus">✋ Hand not detected</p>

  </div>


  <div class="card">

    <h2>📝 Sign Result</h2>

    <div id="resultText">
      Result: Waiting...
    </div>

    <button onclick="testVoice()">
      🔊 Test Voice
    </button>

  </div>


<script>

let stream = null;
let hands = null;
let detecting = false;

let lastResult = "";

const video = document.getElementById("camera");
const statusText = document.getElementById("status");
const handStatus = document.getElementById("handStatus");
const resultText = document.getElementById("resultText");


// =========================
// FRONT CAMERA
// =========================

async function startFrontCamera() {

  stopCamera();

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    video.srcObject = stream;

    statusText.innerText =
      "✅ Front Camera Working";

    startHandDetection();

  } catch (error) {

    console.log(error);

    statusText.innerText =
      "❌ Front Camera Error";

  }
}


// =========================
// BACK CAMERA
// =========================

async function startBackCamera() {

  stopCamera();

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          exact: "environment"
        }
      },
      audio: false
    });

    video.srcObject = stream;

    statusText.innerText =
      "✅ Back Camera Working";

    startHandDetection();

  } catch (error) {

    try {

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment"
        },
        audio: false
      });

      video.srcObject = stream;

      statusText.innerText =
        "✅ Back Camera Working";

      startHandDetection();

    } catch (error2) {

      statusText.innerText =
        "❌ Back Camera Error";

    }
  }
}


// =========================
// STOP CAMERA
// =========================

function stopCamera() {

  detecting = false;

  if (stream) {

    stream.getTracks().forEach(track => {
      track.stop();
    });

    stream = null;
  }

  video.srcObject = null;

  statusText.innerText =
    "Camera stopped";

  handStatus.innerText =
    "✋ Hand not detected";

  resultText.innerText =
    "Result: Waiting...";

  lastResult = "";
}


// =========================
// HAND DETECTION
// =========================

function startHandDetection() {

  if (!hands) {

    hands = new Hands({
      locateFile: (file) => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

      }
    });


    hands.setOptions({

      maxNumHands: 1,

      modelComplexity: 1,

      minDetectionConfidence: 0.6,

      minTrackingConfidence: 0.6

    });


    hands.onResults((results) => {

      if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
      ) {

        const landmarks =
          results.multiHandLandmarks[0];


        // YES

        if (detectYes(landmarks)) {

          showResult("YES");

        }


        // NO

        else if (detectNo(landmarks)) {

          showResult("NO");

        }


        // NORMAL HAND

        else {

          handStatus.innerText =
            "✋ Hand Detected";

        }

      }

      else {

        handStatus.innerText =
          "✋ Hand not detected";

      }

    });

  }

  detecting = true;

  detectHand();
}


// =========================
// SEND CAMERA FRAME
// =========================

async function detectHand() {

  if (!detecting) {
    return;
  }

  if (
    video.readyState >= 2 &&
    hands
  ) {

    try {

      await hands.send({
        image: video
      });

    } catch (error) {

      console.log(error);

    }

  }

  requestAnimationFrame(detectHand);
}


// =========================
// YES DETECTION
// =========================

function detectYes(landmarks) {

  const thumbTip = landmarks[4];
  const thumbIP = landmarks[3];

  const indexTip = landmarks[8];
  const indexPIP = landmarks[6];

  const middleTip = landmarks[12];
  const middlePIP = landmarks[10];

  const ringTip = landmarks[16];
  const ringPIP = landmarks[14];

  const pinkyTip = landmarks[20];
  const pinkyPIP = landmarks[18];


  const thumbUp =
    thumbTip.y < thumbIP.y;

  const indexFolded =
    indexTip.y > indexPIP.y;

  const middleFolded =
    middleTip.y > middlePIP.y;

  const ringFolded =
    ringTip.y > ringPIP.y;

  const pinkyFolded =
    pinkyTip.y > pinkyPIP.y;


  return (
    thumbUp &&
    indexFolded &&
    middleFolded &&
    ringFolded &&
    pinkyFolded
  );
}


// =========================
// NO DETECTION
// =========================

function detectNo(landmarks) {

  const indexTip = landmarks[8];
  const indexPIP = landmarks[6];

  const middleTip = landmarks[12];
  const middlePIP = landmarks[10];

  const ringTip = landmarks[16];
  const ringPIP = landmarks[14];

  const pinkyTip = landmarks[20];
  const pinkyPIP = landmarks[18];


  // Index + middle fingers extended

  const indexOpen =
    indexTip.y < indexPIP.y;

  const middleOpen =
    middleTip.y < middlePIP.y;


  // Ring + pinky folded

  const ringFolded =
    ringTip.y > ringPIP.y;

  const pinkyFolded =
    pinkyTip.y > pinkyPIP.y;


  return (
    indexOpen &&
    middleOpen &&
    ringFolded &&
    pinkyFolded
  );
}


// =========================
// SHOW RESULT + VOICE
// =========================

function showResult(result) {

  handStatus.innerText =
    "✋ " + result + " Gesture Detected";

  resultText.innerText =
    result;


  if (lastResult !== result) {

    speakText(result);

    lastResult = result;

  }
}


// =========================
// VOICE
// =========================

function speakText(text) {

  if (!("speechSynthesis" in window)) {

    alert("Voice is not supported");

    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";

  speech.rate = 0.9;

  speech.pitch = 1;

  window.speechSynthesis.speak(speech);
}


// =========================
// TEST VOICE
// =========================

function testVoice() {

  speakText("Yes");

}

</script>

</body>
</html>
